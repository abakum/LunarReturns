name: Deploy

"on":
  workflow_dispatch:

permissions:
  contents: read

env:
  # GITHUB_TOKEN cannot manage repo secrets (rotate_key does gh secret set),
  # so gh runs with a PAT stored in the GH_PAT secret (repo scope).
  GH_TOKEN: ${{ secrets.GH_PAT }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Checkout the page repo (deploy.sh writes FUNCTION_URL/PUSH_URL there)
        uses: actions/checkout@v5
        with:
          repository: abakum/abakum.github.io
          path: abakum.github.io
          token: ${{ secrets.GH_PAT }}

      # actions/checkout cannot write outside the workspace; deploy.sh expects
      # the page at ../abakum.github.io (sibling of this repo) — symlink it.
      - name: Link the page repo to ../abakum.github.io
        run: ln -s "$GITHUB_WORKSPACE/abakum.github.io" "$GITHUB_WORKSPACE/../abakum.github.io"

      - name: Check prerequisites
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          [ -n "$GH_PAT" ] || { echo "::error::secret GH_PAT not found; create a PAT with repo scope and: gh secret set GH_PAT -R abakum/LunarReturns"; exit 1; }
          gh auth status

      - name: Install yc
        run: |
          curl -sSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash -s -- -i "$HOME/yandex-cloud"
          echo "$HOME/yandex-cloud/bin" >> "$GITHUB_PATH"

      - name: Ensure VAPID keys
        run: |
          [ -f vapid_public.txt ] || { echo "::error::vapid_public.txt not found; run ./vapid-keygen.sh locally"; exit 1; }
          gh secret list --json name --jq '.[].name' | grep -qx VAPID_PRIVATE \
            || { echo "::error::secret VAPID_PRIVATE not found; run ./vapid-keygen.sh locally"; exit 1; }
          echo "VAPID keys are in place"

      - name: Configure yc
        env:
          YC_SA_KEY: ${{ secrets.YC_SA_KEY }}
          YC_FOLDER_ID: ${{ secrets.YC_FOLDER_ID }}
        run: |
          printf '%s' "$YC_SA_KEY" > "$RUNNER_TEMP/sa.json"
          yc config set service-account-key "$RUNNER_TEMP/sa.json"
          yc config set folder-id "$YC_FOLDER_ID"
          rm -f "$RUNNER_TEMP/sa.json"

      - name: Deploy
        env:
          VAPID_PRIVATE: ${{ secrets.VAPID_PRIVATE }}
          VK_APP_SECRET: ${{ secrets.VK_APP_SECRET }}
          VK_SERVICE_TOKEN: ${{ secrets.VK_SERVICE_TOKEN }}
        run: VAPID_PUBLIC="$(tr -d ' \n' < vapid_public.txt)" ./deploy.sh deploy
